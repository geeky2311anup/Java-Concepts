<template tag-name="contact-note-view"> <div class="spread-parent" id="contact-editor-wrap"> <div class="editor-space contact-editor"> <div id="contact-image-wrapper"> <div id="front-card-image" class="contact-card-image" style="{{backgroundimagestyle(frontImageUrl)}}"></div> <div id="back-card-image" class="contact-card-image" style="{{backgroundimagestyle(backImageUrl)}}"></div> </div> <div id="contact-details-wrapper"> <div class="wrapper-div"> <div id="first-name-div" class="input-div"> <label>{{translate('contact.firstName')}}</label> <div class="value-div">{{contactObject.firstName}}</div> </div> <div id="last-name-div" class="input-div"> <label>{{translate('contact.lastName')}}</label> <div class="value-div">{{contactObject.lastName}}</div> </div> </div> <div id="jobs-div" class="wrapper-div"> <template is="for" items="{{contactObject.jobs}}" item="job" index="index"> <div class="input-div job-div"> <label> {{translate('contact.job')}} </label> <div class="value-div">{{job}}</div> </div> </template> </div> <div id="organizations-div" class="wrapper-div"> <template is="for" items="{{contactObject.organizations}}" item="organization" index="index"> <div class="input-div organization-div"> <label> {{translate('contact.organization')}} </label> <div class="value-div">{{organization}}</div> </div> </template> </div> <div id="numbers-div" class="wrapper-div"> <template is="for" items="{{contactObject.numbers}}" item="number" index="index"> <div class="input-div number-div"> <label> {{translate('contact.phone')}} </label> <div class="value-div">{{number}}</div> </div> </template> </div> <div id="emails-div" class="wrapper-div"> <template is="for" items="{{contactObject.emails}}" item="email" index="index"> <div class="input-div email-div"> <label> {{translate('contact.email')}} </label> <div class="value-div">{{email}}</div> </div> </template> </div> <div id="websites-div" class="wrapper-div"> <template is="for" items="{{contactObject.websites}}" item="website" index="index"> <div class="input-div website-div"> <label> {{translate('contact.website')}} </label> <div class="value-div">{{website}}</div> </div> </template> </div> <div id="addresses-div" class="wrapper-div"> <template is="for" items="{{contactObject.addresses}}" item="address" index="index"> <div class="input-div street-div"> <label> {{translate('contact.street')}} </label> <div class="value-div">{{address.street}}</div> </div> <div class="input-div city-div"> <label> {{translate('contact.city')}} </label> <div class="value-div">{{address.city}}</div> </div> <div class="input-div region-div"> <label> {{translate('contact.state')}} </label> <div class="value-div">{{address.region}}</div> </div> <div class="input-div country-div"> <label> {{translate('contact.country')}} </label> <div class="value-div">{{address.country}}</div> </div> <div class="input-div code-div"> <label> {{translate('contact.zip')}} </label> <div class="value-div">{{address.code}}</div> </div> </template> </div> <div id="socials-div" class="wrapper-div"> <template is="for" items="{{contactObject.socialnetworks}}" item="socialnetwork" index="index"> <div class="input-div social-div"> <label> {{translate('contact.social')}} </label> <div class="value-div">{{socialnetwork}}</div> </div> </template> </div> <div id="notes-div" class="wrapper-div"> <div class="input-div notes-div"> <label> {{translate('contact.notes')}} </label> <div class="value-div">{{contactObject.notes}}</div> </div> </div> </div> </div> </div> </template>
<template tag-name="alert-box"> <div id="alert-box" class="alert-box-wrap"> <div class="alert-box-container"> <div id="alert-message"> </div> <div class="alert-buttons"> <div class="buttons first" id="cancel-button" click="alert-box =&gt; cancel()"> </div> <div class="buttons" id="proceed-button" click="alert-box =&gt; proceed()"> </div> <div class="buttons" id="ok-button" click="alert-box =&gt; cancel()"> </div> </div> </div> </div> </template>
<template tag-name="report-abuse-dialog"> <div id="report-abuse-container"> <div id="report-abuse-title"> <div class="report-abuse-back" click="report-abuse-dialog =&gt; close()">{{translate("options.cancel")}}</div> <span>{{translate("generalOption.reportAbuse")}}</span> <template is="if" value="{{isSendingMail}}"><template case="true"> <div class="report-abuse-button sending show">{{translate("options.sending")}}</div> </template><template case="false"> <div id="report-abuse-send" class="report-abuse-button show" click="report-abuse-dialog =&gt; reportViaEmail()">{{translate("options.send")}}</div> </template></template> </div> <div id="from-field" class="report-field" focusout="report-abuse-dialog =&gt; validateFromField()"> <div id="report-id-label">{{translate("email.email")}} :</div> <template is="if" value="{{invalidUserEmail}}"><template case="true"> <div class="choosen-contact invalid-email"> {{fromValue}} <div class="inote-option cancel-mark inote-option-white iclose-dim" click="report-abuse-dialog =&gt; removeMail()"> </div> </div> </template><template case="false"> <div class="user-report-field input"> <div class="text-input report-abuse-input" id="email-id" contenteditable="true" keyup="report-abuse-dialog =&gt; setInput(this)"></div> </div> </template></template> </div> <div id="subject-field" class="report-field" focusout="report-abuse-dialog =&gt; validateFromField()"> <div id="report-id-label">{{translate("email.subject")}} :</div> <div class="user-report-field input"> <div class="text-input report-abuse-input" id="subject" contenteditable="true">{{translate("reportAbuse.subject")}}</div> </div> </div> <div id="report-abuse-message" contenteditable="true" keydown="report-abuse-dialog =&gt; keyDownAction(event)"> <br>{{translate("reportAbuse.hiThere")}},<br> <br>{{translate("reportAbuse.reportContent")}}:<br> <br>{{reportLink}}<br> <br>{{translate("reportAbuse.thanks")}} <br> </div> </div> </template>
<template tag-name="file-in-text-preview"> <div class="position-absolute top-0 left-0 bottom-0 right-0 zindex-10 top-0 file-in-text-preview bg-black-strict {{if(notecard.permission,'d-flex align-items-center justify-content-center')}}"> <div class="file-preview-close inote-option inote-option-white iclose-dark m-3 cursor-pt zindex-99999 position-absolute right-0 top-0" data-znqa="close-btn-file-in-text-preview" click="file-in-text-preview =&gt; closeFilePreview()"></div> <template is="if" value="{{contentDownloading}}"><template case="true"> <dots-loading white-dots="true"> </dots-loading> </template><template case="false"><template is="if" value="{{hasPreview}}"><template case="true"> <template is="if" value="{{isIframeLoad}}"><template case="true"> <div class="iframe-container w-100 d-flex justify-content-center align-items-center h-100 p-3"> <iframe src="{{embedObj.docs_preview_url}}" id="preview-iframe" class="file-preview-iframe h-100 transition-all-300-linear br-xs"> </iframe> </div> </template><template case="false"> <div class="helper"></div> <img src="{{embedObj.docs_preview_url}}" class="image-content-preview"> </template></template> </template><template case="false"> <div class="no-preview-wrap"> <template is="if" value="{{noDataAvailable}}"><template case="true"> <div id="no-data-file"> <div class="no-gutters align-items-center"> <div id="iunsupported-card" class="mx-auto mb-2"></div> </div> <div id="error-content" class="d-flex flex-column justify-content-center align-items-center"> <div id="content">{{translate('generalOption.noFileData')}}</div> <div>{{translate('generalOption.noFileDataDesc')}}</div> </div> </div> </template></template> </div> </template></template></template></template> </div> </template>
</div><div id="keep-alive-div" style="display:none"></div><div class="glasp-extension-toaster" style="display: block; width: 320px; margin: unset; padding: unset; border: unset; border-radius: unset; outline: unset; background-color: unset; box-shadow: unset; position: fixed; top: 40px; right: 24px; z-index: 9999;"><template shadowrootmode="open"><div class="glasp-extension" style="font-family: inherit;"></div></template></div></body>
